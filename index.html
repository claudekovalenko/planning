<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2027</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --gold: #c9a25e;
    --gold-soft: rgba(201, 162, 94, 0.15);
    --line: #2a2e38;
    --sans: 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 3rem 16px 4rem; }
  .label { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

  [contenteditable] { outline: none; border-radius: 4px; cursor: text; }
  [contenteditable]:focus { background: var(--gold-soft); box-shadow: 0 0 0 4px var(--gold-soft); }
  [contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); font-style: italic; }

  .year { font-size: 3.5rem; line-height: 1; color: var(--gold); }
  .lead { margin-top: 2rem; }
  .lead .text { font-size: 1.3rem; font-style: italic; margin-top: 0.4rem; }

  .goal { margin-top: 2.25rem; }
  .goal .num { color: var(--gold); font-family: var(--sans); font-size: 0.8rem; }
  .goal .text { font-size: 1.2rem; margin-top: 0.15rem; }
  .step { display: flex; gap: 0.75rem; align-items: flex-start; margin-top: 0.75rem; padding: 0.75rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .step .text { flex: 1; min-width: 0; }
  .check { flex: none; width: 24px; height: 24px; border: 1.5px solid var(--muted); border-radius: 50%; background: none; cursor: pointer; }
  .check:hover { border-color: var(--gold); }
  .taken { margin-top: 0.4rem; font-family: var(--sans); font-size: 0.75rem; color: var(--muted); }

  .foot { margin-top: 3.5rem; text-align: center; font-style: italic; color: var(--muted); font-size: 0.9rem; }
  .foot span { display: block; font-style: normal; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em; margin-top: 0.25rem; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  var KEY = 'planning.simple.v1';
  var DRAFT = {
    lead: 'Planted in one church, making disciples on campus, and getting ready to be a husband.',
    goals: [
      { text: 'Raise up disciples', step: 'Write my disciple-making pathway on one page', taken: 0 },
      { text: 'Be planted', step: 'Decide which church I am committing to', taken: 0 },
      { text: 'Prepare for marriage', step: 'Ask a married mentor to walk with me', taken: 0 }
    ]
  };

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.goals)) state = JSON.parse(JSON.stringify(DRAFT));
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ed(path, value, ph) { return '<div class="text" contenteditable="true" data-path="' + path + '" data-ph="' + ph + '">' + esc(value) + '</div>'; }

  function render() {
    var h = '<div class="year">2027</div>' +
      '<div class="lead"><span class="label">Where God is leading me</span>' + ed('lead', state.lead, 'One sentence') + '</div>';
    state.goals.forEach(function (g, i) {
      h += '<div class="goal"><span class="num">' + (i + 1) + '</span>' + ed('goals.' + i + '.text', g.text, 'Something for this year') +
        '<div class="step"><button class="check" data-done="' + i + '" aria-label="Step done"></button>' +
        ed('goals.' + i + '.step', g.step, 'Next step') + '</div>' +
        (g.taken ? '<div class="taken">' + g.taken + ' step' + (g.taken === 1 ? '' : 's') + ' taken</div>' : '') + '</div>';
    });
    h += '<div class="foot">“The heart of man plans his way, but the LORD establishes his steps.”<span>PROVERBS 16:9</span></div>';
    document.getElementById('app').innerHTML = h;
  }

  document.addEventListener('input', function (e) {
    var p = e.target.dataset.path; if (!p) return;
    var parts = p.split('.'), o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = e.target.textContent.trim();
    save();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('paste', function (e) {
    if (!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text').replace(/\s+/g, ' '));
  });

  // Ticking a step counts it and clears the line for the next one.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-done]'); if (!b) return;
    var g = state.goals[+b.dataset.done];
    if (!g.step) return;
    g.taken = (g.taken || 0) + 1;
    g.step = '';
    save(); render();
    document.querySelector('[data-path="goals.' + b.dataset.done + '.step"]').focus();
  });

  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
