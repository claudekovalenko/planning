<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Five-Year Plan</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1e222b;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --gold: #c9a25e;
    --gold-soft: rgba(201, 162, 94, 0.15);
    --line: #2a2e38;
    --green: #8fbf8f;
    --rust: #b06557;
    --sans: 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; line-height: 1.5; min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 16px 4rem; }
  .label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  [contenteditable] { outline: none; border-radius: 4px; cursor: text; }
  [contenteditable]:focus { background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft); }
  [contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); font-style: italic; opacity: 0.7; }

  nav.parts { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; }
  nav.parts button { background: none; border: none; padding: 0.2rem 0 0.65rem; font-family: var(--sans); font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.parts button.on { color: var(--gold); border-bottom-color: var(--gold); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 { font-weight: normal; font-size: 1.6rem; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .switch button { background: none; border: none; padding: 0.5rem 1rem; font-family: var(--sans); font-size: 0.85rem; color: var(--muted); }
  .switch button + button { border-left: 1px solid var(--line); }
  .switch button.on { background: var(--gold); color: #1a1408; font-weight: 600; }
  .intro { margin-top: 0.75rem; color: var(--muted); font-size: 0.92rem; max-width: 40rem; }
  .direction { border-left: 2px solid var(--gold); padding: 0.15rem 0 0.15rem 0.9rem; margin-top: 1rem; max-width: 46rem; }
  .trajectory { margin-top: 0.9rem; padding: 0.7rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-width: 46rem; }
  .trajectory .text { font-size: 0.95rem; margin-top: 0.25rem; }
  .direction .text { font-style: italic; font-size: 1.05rem; margin-top: 0.2rem; }
  .age .sep { font-style: normal; }
  .age { font-family: var(--sans); font-size: 0.75em; color: var(--muted); font-weight: normal; white-space: nowrap; }
  .hd.goal .age, .cell.end .yr .age { color: var(--gold); opacity: 0.8; }
  .draft { margin-top: 1rem; font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }
  .draft button { background: none; border: none; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-size: 0.8rem; }

  /* ── 5 years ── */
  .five { margin-top: 1.5rem; display: grid; grid-template-columns: 11rem repeat(4, 1fr) 1.25fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .five > div { padding: 0.8rem 0.85rem; border-top: 1px solid var(--line); border-left: 1px solid var(--line); font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
  .five > .hd { border-top: none; background: var(--panel); font-family: var(--sans); font-size: 0.78rem; color: var(--muted); }
  .five > .hd.goal { color: var(--gold); }
  .five > .area { border-left: none; background: var(--panel); }
  .five > .area .name { font-size: 1rem; }
  .five > .cell.end { background: rgba(201, 162, 94, 0.07); }
  .five > .cell.now { background: rgba(255, 255, 255, 0.02); }
  .five.long { grid-template-columns: 10rem repeat(5, 1fr); }
  .tl { position: relative; margin-top: 1.5rem; padding-left: 1.6rem; }
  .tl::before { content: ''; position: absolute; left: 0.45rem; top: 0.6rem; bottom: 0.5rem; width: 2px; background: linear-gradient(var(--gold), var(--line)); }
  .node { position: relative; }
  .node::before { content: ''; position: absolute; left: -1.5rem; top: 0.45rem; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold); }
  .node.now::before { background: var(--gold); box-shadow: 0 0 0 5px var(--gold-soft); }
  .when { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.35rem; }
  .when b { font-weight: normal; font-size: 1.35rem; color: var(--gold); }
  .when span { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); }
  .it { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.3rem 0; }
  .it .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 0.55rem; }
  .it .body { flex: 1; min-width: 0; display: grid; grid-template-columns: 9rem 1fr; gap: 0.6rem; }
  .it .an { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); padding-top: 0.2rem; }
  .it .an select { background: none; border: none; padding: 0; font-size: 0.75rem; color: var(--muted); max-width: 100%; }
  .small { font-size: 0.86rem; }
  @media (max-width: 560px) { .it .body { grid-template-columns: 1fr; gap: 0; } }
  .focus { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.6rem; margin-top: 1.25rem; align-items: start; }
  .fcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; }
  .fcard.first { border-color: var(--gold); background: linear-gradient(var(--gold-soft), var(--panel)); }
  .fcard .ft { font-size: 1.25rem; margin-top: 0.2rem; }
  .fcard.first .ft { color: var(--gold); font-size: 1.45rem; }
  .fcard .fw { font-family: var(--sans); font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
  .zoom { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-top: 1.5rem; }
  .zoom button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.3rem 0.7rem; font-family: var(--sans); font-size: 0.78rem; color: var(--muted); }
  .zoom button.on { color: var(--gold); border-color: var(--gold); }
  .lin-wrap { overflow-x: auto; margin-top: 0.6rem; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); -webkit-overflow-scrolling: touch; }
  .lin { position: relative; }
  .lin .axis { position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); opacity: 0.5; }
  .lin .tick { position: absolute; width: 1px; height: 10px; background: var(--muted); }
  .lin .yl { position: absolute; transform: translateX(-50%); font-family: var(--sans); font-size: 0.7rem; color: var(--muted); text-align: center; line-height: 1.2; }
  .lin .yl i { display: block; font-style: normal; font-size: 0.62rem; opacity: 0.7; }
  .lin .nowline { position: absolute; top: 0; width: 2px; background: var(--ink); opacity: 0.25; }
  .lin .nowlab { position: absolute; bottom: 4px; transform: translateX(-50%); font-family: var(--sans); font-size: 0.65rem; color: var(--ink); opacity: 0.6; }
  .lin .pin { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -3px); }
  .lin .pin.big { width: 14px; height: 14px; transform: translate(-50%, -6px); box-shadow: 0 0 0 3px var(--panel); }
  .lin .stem { position: absolute; width: 1px; background: var(--line); z-index: 0; }
  .lin .pin { z-index: 1; }
  .lin .ml { z-index: 2; }
  .lin .ml { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--sans); font-size: 0.75rem; color: var(--muted); }
  .lin .ml.big { font-family: Georgia, serif; font-size: 0.95rem; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 0.1rem 0.5rem 0.1rem 0.4rem; display: flex; align-items: center; gap: 0.35rem; }
  .lin .ml.big b { flex: none; width: 6px; height: 6px; border-radius: 50%; border: 3px solid; }
  .lin .ml.focus { border-color: var(--gold); color: var(--gold); }
  .lin .ml.key { font-size: 1.1rem; background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: bold; }
  .lin .ml.key b { border-color: #1a1408 !important; }
  .lin .pin.key { width: 18px; height: 18px; transform: translate(-50%, -8px); background: var(--gold) !important; }
  .star.key { color: var(--gold); letter-spacing: -0.15em; }
  h2.tight { margin-top: 1.25rem; }
  .prep { margin-top: 0.9rem; border-top: 1px solid rgba(201, 162, 94, 0.3); padding-top: 0.7rem; }
  .prep-head { display: flex; width: 100%; justify-content: space-between; align-items: baseline; background: none; border: none; padding: 0; text-align: left; }
  .prep-head .chev { font-style: normal; display: inline-block; margin-left: 0.3rem; transition: transform 0.15s; transform: rotate(-90deg); }
  .prep.open .prep-head .chev { transform: none; }
  .prep-n { font-family: var(--sans); font-size: 0.8rem; color: var(--gold); }
  .prep-bar { height: 4px; background: var(--panel-2); border-radius: 99px; margin: 0.4rem 0 0.5rem; overflow: hidden; }
  .prep-bar span { display: block; height: 100%; background: var(--gold); }
  .prep-it { display: flex; align-items: center; gap: 0.55rem; padding: 0.25rem 0; }
  .prep-it [contenteditable] { flex: 1; min-width: 0; }
  .prep-it [contenteditable] { color: var(--muted); }
  .prep-it.done [contenteditable] { color: var(--ink); }
  .prep-it .check { width: 18px; height: 18px; font-size: 11px; }
  .prep-it .check.on { background: var(--gold); border-color: var(--gold); }
  .prep .add { margin-top: 0.3rem; }
  .fnote { margin-top: 0.45rem; font-size: 0.92rem; font-style: italic; color: var(--ink); opacity: 0.85; }
  .prep-note { margin-top: 0.6rem; font-size: 0.88rem; font-style: italic; color: var(--muted); }
  .small-cards .ft { font-size: 1.05rem; }
  .lin .ml.done { opacity: 0.45; text-decoration: line-through; }
  .mlist { display: flex; flex-direction: column; gap: 0.35rem; }
  .mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) 9.5rem 9.5rem 8rem auto auto; gap: 0.5rem; align-items: center; }
  .mrow input, .mrow select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0.35rem 0.55rem; font-size: 15px; min-width: 0; width: 100%; color-scheme: dark; }
  .mrow select { font-family: var(--sans); font-size: 13px; }
  .mrow .mwhen { font-family: var(--sans); font-size: 0.72rem; color: var(--muted); }
  .mrow.done input[data-m="title"] { color: var(--muted); text-decoration: line-through; }
  .star { background: none; border: none; color: var(--line); font-size: 1.1rem; padding: 0 0.1rem; }
  .star.on { color: var(--gold); }
  @media (max-width: 760px) {
    .mrow { grid-template-columns: auto minmax(0, 1fr) auto auto; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
    .mrow input[type=month], .mrow select { grid-column: 2 / 3; }
    .mrow .mwhen { grid-column: 2 / 3; }
  }
  .five .yr { display: none; }
  .five .x { float: right; }

  /* ── 2027 timeline ── */
  .months { display: grid; grid-template-columns: repeat(12, 1fr); margin-top: 1.5rem; font-family: var(--sans); font-size: 0.7rem; color: var(--muted); position: sticky; top: 0; background: var(--bg); padding: 0.5rem 0; z-index: 2; border-bottom: 1px solid var(--line); }
  .months span { text-align: left; padding-left: 3px; }
  .months span.cur { color: var(--gold); }
  .group { margin-top: 1.5rem; }
  .group-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .group-head .name { font-size: 1.1rem; }
  .group-head .yeargoal { font-size: 0.88rem; color: var(--muted); flex: 1 1 16rem; }
  .group-head .yeargoal b { font-weight: normal; color: var(--gold); font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.12em; margin-right: 0.35rem; }

  .row { margin-top: 0.6rem; }
  .row-top { display: flex; align-items: center; gap: 0.6rem; }
  .check { flex: none; width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 50%; background: none; display: grid; place-items: center; font-size: 12px; color: var(--bg); }
  .check.on { background: var(--green); border-color: var(--green); }
  .row-title { flex: 1; min-width: 0; cursor: pointer; }
  .row.done .row-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .due { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .due.soon { color: var(--gold); }
  .due.late { color: var(--rust); }
  .track {
    position: relative; height: 12px; margin-top: 0.35rem; border-radius: 3px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 12));
    background-color: var(--panel);
  }
  .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: var(--gold); min-width: 6px; }
  .row.done .bar { background: var(--green); opacity: 0.6; }
  .row.late .bar { background: var(--rust); }
  .today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.7; }

  .editor { margin-top: 0.6rem; padding: 0.8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .editor .full { grid-column: 1 / -1; }
  .editor label { display: block; font-family: var(--sans); font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .editor input, .editor select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.6rem; font-size: 16px; }
  .editor input[type=date] { color-scheme: dark; }
  .editor .actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; }
  .editor .actions .sp { flex: 1; }
  .btn { background: var(--gold); color: #1a1408; border: none; border-radius: 8px; padding: 0.45rem 1rem; font-family: var(--sans); font-size: 0.85rem; font-weight: 600; }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: normal; }
  .btn.del { background: none; color: var(--rust); border: 1px solid var(--rust); font-weight: normal; }
  .add { margin-top: 0.6rem; background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 0.35rem 0.8rem; font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }
  .add:hover { color: var(--gold); border-color: var(--gold); }
  .x { background: none; border: none; color: var(--muted); opacity: 0.5; font-size: 1rem; line-height: 1; }
  .x:hover { opacity: 1; color: var(--rust); }

  .foot { margin-top: 3rem; text-align: center; font-style: italic; color: var(--muted); font-size: 0.9rem; }
  .foot span { display: block; font-style: normal; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em; margin-top: 0.25rem; }

  /* Phones: the five-year table becomes one card per area, years stacked. */
  @media (max-width: 760px) {
    .five { display: block; border: none; }
    .five > .hd { display: none; }
    .five > div { border: none; padding: 0.35rem 0; }
    .five > .area { background: none; margin-top: 1.5rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--line); }
    .five > .cell { display: grid; grid-template-columns: 3.2rem 1fr; gap: 0.5rem; }
    .five > .cell.end { background: none; }
    .five > .cell.now { background: none; }
    .five .cell { grid-template-columns: 3.6rem 1fr; }
    .five .yr .age { display: block; font-size: 0.7rem; }
    .five .yr { display: block; font-family: var(--sans); font-size: 0.75rem; color: var(--muted); padding-top: 0.15rem; }
    .five .cell.end .yr { color: var(--gold); }
  }

  /* Phone-friendly */
  .vl { position: relative; margin-top: 0.9rem; padding-left: 1.5rem; }
  .vl::before { content: ''; position: absolute; left: 0.4rem; top: 0.5rem; bottom: 0.5rem; width: 2px; background: linear-gradient(var(--gold), var(--line)); }
  .vnow, .vy { position: relative; display: flex; align-items: baseline; gap: 0.6rem; }
  .vnow::before, .vy::before { content: ''; position: absolute; left: -1.5rem; top: 0.45rem; width: 12px; height: 12px; margin-left: 0.05rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold); }
  .vnow::before { background: var(--gold); box-shadow: 0 0 0 5px var(--gold-soft); }
  .vnow b, .vy b { font-weight: normal; font-size: 1.25rem; color: var(--gold); }
  .vnow span, .vy span { font-family: var(--sans); font-size: 0.78rem; color: var(--muted); }
  .vyear { margin-top: 1.1rem; }
  .vm { display: flex; gap: 0.6rem; align-items: flex-start; margin-top: 0.45rem; padding: 0.15rem 0; }
  .vm i { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 0.55rem; }
  .vm .vt { font-size: 1rem; }
  .vm .vw { font-family: var(--sans); font-size: 0.74rem; color: var(--muted); }
  .vm.big { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.75rem; }
  .vm.key { background: var(--gold); border-radius: 10px; padding: 0.65rem 0.8rem; }
  .vm.key .vt { color: #1a1408; font-weight: bold; font-size: 1.1rem; }
  .vm.key .vw { color: #3b2d12; }
  .vm.key i { background: #1a1408 !important; }
  .vm.done { opacity: 0.45; }
  .an { position: relative; }
  .an .an-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .it .an select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

  @media (max-width: 600px) {
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    .wrap { padding-top: 1rem; }
    nav.parts { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 0; justify-content: center;
      background: rgba(15, 17, 21, 0.97); border-top: 1px solid var(--line); border-bottom: none;
      padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    nav.parts button { flex: 1; max-width: 220px; padding: 0.95rem 0 1rem; border-bottom: none; border-top: 2px solid transparent; margin: -1px 0 0; }
    nav.parts button.on { border-top-color: var(--gold); }
    h1 { font-size: 1.45rem; line-height: 1.25; }
    h1 .age { display: block; font-size: 0.85rem; margin-top: 0.2rem; }
    h1 .age .sep { display: none; }
    header { gap: 0.75rem; }
    .switch { width: 100%; display: flex; }
    .switch button { flex: 1; padding: 0.65rem 0.25rem; }
    .x { padding: 0.45rem 0.55rem; font-size: 1.25rem; opacity: 0.6; }
    .check { width: 26px; height: 26px; font-size: 14px; }
    .prep-it .check { width: 24px; height: 24px; }
    .prep-it { padding: 0.4rem 0; }
    .prep-head { padding: 0.35rem 0; }
    .add { padding: 0.6rem 1rem; font-size: 0.85rem; }
    .zoom button { padding: 0.5rem 0.75rem; }
    .row-top { gap: 0.7rem; }
    .due { font-size: 0.72rem; }
    .mrow input, .mrow select, .editor input, .editor select { font-size: 16px; }
    .it .body { gap: 0.1rem; }
    .it { padding: 0.45rem 0; border-bottom: 1px solid var(--line); }
    .direction .text { font-size: 1rem; }
    .fcard .ft { font-size: 1.2rem; }
    .fcard.first .ft { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  var KEY = 'planning.five.v1';
  var START = 2027, YEARS = [2027, 2028, 2029, 2030, 2031], MID = 2036, FAR = 2046, FORTY = 2066, FIFTY = 2076;
  var THIS_YEAR = new Date().getFullYear();
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var OLD_DIRECTIONS = ['Growing in preaching, and from there into disciple-making: messages that hand people a next step, and a pathway that carries them from reached to sent.', 'Rooted in a church I grow deeply with; from there, growing in preaching, and from preaching into disciple-making.'];
  var OLD_DIRECTION_10 = 'Rooted in a church I grow deeply with; from there, growing my own teaching ministry, and from teaching into disciple-making.';
  var DIRECTION = 'Rooted in a church I grow deeply with; from there, growing my own teaching ministry, and from teaching into disciple-making \u2014 growing all the while as a sound, God-loving theologian.';
  var CHURCH = { id: 'church', name: 'Church home', years: {
    2027: 'Found a church where children grow in ways that impress me; committed and serving',

    h += state.view === 'long' || state.view === 'timeline'
      ? '<div class="direction"><span class="label">Where it is all heading</span>' + ed('longDirection', state.longDirection, 'Over my lifetime, I sense God leading me toward\u2026', 'text') + '</div>'
      : '<div class="direction"><span class="label">The direction</span>' + ed('direction', state.direction, 'Where I sense God leading over these five years', 'text') + '</div>';
    h += '<div class="trajectory"><span class="label">Lifelong trajectory</span>' + ed('trajectory', state.trajectory, 'Who I am becoming, all the days of my life', 'text') + '</div>';
    h += ({ long: longView, timeline: timelineView, five: fiveYears, year: thisYear }[state.view] || fiveYears)();
    if (state.isDraft) h += '<p class="draft">A starting draft from your Vision. Tap any text to rewrite it. <button data-act="blank">Start blank</button></p>';
    h += '<div class="foot">“The heart of man plans his way, but the LORD establishes his steps.”<span>PROVERBS 16:9</span></div>';
    document.getElementById('app').innerHTML = h;
  }

  function fiveYears() {
    var h = '<p class="intro">Where you want to be by ' + YEARS[4] + ' in each area, and the milestone for the end of each year on the way there.</p>';
    h += '<div class="five"><div class="hd">Area</div>' + YEARS.map(function (y) {
      return '<div class="hd' + (y === YEARS[4] ? ' goal' : '') + '">' + (y === YEARS[4] ? 'By ' + y + ' — the goal' : 'End of ' + y) + ageTag(y) + '</div>';
    }).join('');
    state.areas.forEach(function (a, i) {
      h += '<div class="area"><button class="x" data-act="area-del" data-i="' + i + '" title="Remove area">×</button>' + ed('areas.' + i + '.name', a.name, 'Area', 'name') + '</div>';
      YEARS.forEach(function (y) {
        var cls = 'cell' + (y === YEARS[4] ? ' end' : '') + (y === START ? ' now' : '');
        h += '<div class="' + cls + '"><span class="yr">' + (y === YEARS[4] ? 'By ' + y : y) + ageTag(y, 'age ') + '</span>' +
          ed('areas.' + i + '.years.' + y, a.years[y], y === YEARS[4] ? 'Where I want to be' : 'Milestone') + '</div>';
      });
    });
    h += '</div><button class="add" data-act="area-add">+ Add an area</button>';
    return h;
  }

  var HORIZON = {}; HORIZON[YEARS[4]] = '5 years'; HORIZON[MID] = '10 years'; HORIZON[FAR] = '20 years'; HORIZON[FORTY] = '40 years'; HORIZON[FIFTY] = '50 years';

  function longView() {
    var cols = [YEARS[4], MID, FAR, FORTY, FIFTY];
    var h = '<p class="intro">Where each area is heading over a lifetime. The five-year goal is the first step toward it.</p>';
    h += '<div class="five long"><div class="hd">Area</div>' + cols.map(function (y) {
      return '<div class="hd' + (y === FIFTY ? ' goal' : '') + '">By ' + y + ' \u2014 ' + HORIZON[y] + ageTag(y) + '</div>';
    }).join('');
    state.areas.forEach(function (a, i) {
      h += '<div class="area"><button class="x" data-act="area-del" data-i="' + i + '" title="Remove area">\u00d7</button>' + ed('areas.' + i + '.name', a.name, 'Area', 'name') + '</div>';
      cols.forEach(function (y) {
        h += '<div class="cell' + (y === FIFTY ? ' end' : '') + '"><span class="yr">By ' + y + ageTag(y, 'age ') + '</span>' +
          ed('areas.' + i + '.years.' + y, a.years[y], 'In ' + HORIZON[y]) + '</div>';
      });
    });
    h += '</div><button class="add" data-act="area-add">+ Add an area</button>';

  }

  var COLORS = ['#c9a25e', '#7fa8c9', '#8fbf8f', '#c98a9a', '#b7a6d9', '#c97f5e', '#9fc7c0', '#d6c27a'];
  function colorOf(id) { var i = state.areas.findIndex(function (a) { return a.id === id; }); return i < 0 ? 'var(--muted)' : COLORS[i % COLORS.length]; }

  // A straight line through life: the big milestones above it, the smaller
  // ones below, and the next big things pulled out as what to focus on now.
  var ZOOMS = [10, 20, 50, 60];
  function ym(s) { var p = String(s || '').split('-'); return new Date(+p[0], p[1] ? +p[1] - 1 : 6, 15); }
  function whenText(s) { var p = String(s || '').split('-'); return p[1] ? MONTHS[+p[1] - 1] + ' ' + p[0] : (p[0] || '?'); }
  function until(s) {
    var m = Math.round((ym(s) - today) / (30.44 * 864e5));
    if (m <= 0) return 'now';
    if (m < 12) return 'in ' + m + ' month' + (m === 1 ? '' : 's');
    var y = Math.floor(m / 12), r = m % 12;
    return 'in ' + y + ' yr' + (y === 1 ? '' : 's') + (r && y < 5 ? ' ' + r + ' mo' : '');
  }
  function ageAt(s) { return state.born ? ' · age ' + (ym(s).getFullYear() - state.born) : ''; }

  function PHONE() { return window.innerWidth < 600; }

  // On a phone the line runs downward, a year at a time.
  function vline(list) {
    var h = '<div class="vl"><div class="vnow"><b>Now</b><span>' + MONTHS[today.getMonth()] + ' ' + THIS_YEAR + ageTag(THIS_YEAR, '\u00b7 age ') + '</span></div>';
    var byYear = {};
    list.forEach(function (m) { var y = ym(m.date).getFullYear(); (byYear[y] = byYear[y] || []).push(m); });
    Object.keys(byYear).sort().forEach(function (y) {
      h += '<div class="vyear"><div class="vy"><b>' + y + '</b><span>' + (state.born ? 'age ' + (y - state.born) : '') + '</span></div>';
      byYear[y].forEach(function (m) {
        h += '<div class="vm' + (m.key ? ' key' : m.big ? ' big' : '') + (m.done ? ' done' : '') + '"><i style="background:' + colorOf(m.area) + '"></i>' +
          '<div><div class="vt">' + esc(m.title) + '</div><div class="vw">' + whenText(m.date) + ' \u00b7 ' + until(m.date) + '</div></div></div>';
      });
      h += '</div>';
    });
    return h + '</div>';
  }

  // A list that folds under a card: heading, count and bar when closed.
  function checklist(key, openKey, title, ph, noteKey) {
    var list = state[key] || [], ready = list.filter(function (x) { return x.done; }).length, open = !!state[openKey];
    return '<div class="prep' + (open ? ' open' : '') + '" data-cl="' + key + '"><button class="prep-head" data-act="cl-fold" data-open-key="' + openKey + '" aria-expanded="' + open + '">' +
      '<span class="label">' + title + '</span><span class="prep-n">' + ready + ' of ' + list.length + ' <i class="chev">\u25be</i></span></button>' +
      '<div class="prep-bar"><span style="width:' + (list.length ? 100 * ready / list.length : 0) + '%"></span></div>' +
      (!open ? '' : list.map(function (x) {
        return '<div class="prep-it' + (x.done ? ' done' : '') + '" data-cl-id="' + x.id + '"><button class="check' + (x.done ? ' on' : '') + '" data-act="cl-toggle" aria-label="Done">' + (x.done ? '\u2713' : '') + '</button>' +
          '<span contenteditable="true" data-cl-text="1" data-ph="' + ph + '">' + esc(x.text) + '</span><button class="x" data-act="cl-del" title="Remove">\u00d7</button></div>';
      }).join('') + '<button class="add" data-act="cl-add">+ Add</button>' +
      (noteKey ? ed(noteKey, state[noteKey], 'A note', 'prep-note') : '')) + '</div>';
  }

  function timelineView() {
    var ms = (state.milestones || []).slice().sort(function (a, b) { return ym(a.date) - ym(b.date); });
    var keys = ms.filter(function (m) { return m.key && !m.done; });
    var next = ms.filter(function (m) { return m.big && !m.key && !m.done && ym(m.date) >= new Date(today.getFullYear(), today.getMonth() - 1, 1); }).slice(0, 2);
    var focus = keys.concat(next);
    var h = '<p class="intro">The big things on one line. What stands out, and what to focus on now.</p>';

    if (keys.length) {
      h += '<h2 class="tight">The ' + (keys.length === 2 ? 'two ' : '') + 'biggest thing' + (keys.length === 1 ? '' : 's') + '</h2><div class="focus">' + keys.map(function (m) {
        var prep = '';
        var note = m.area === 'church' ? ed('churchNote', state.churchNote, 'A note', 'fnote') : m.area === 'marriage' ? ed('marriageNote', state.marriageNote, 'A note', 'fnote') : '';
        if (m.area === 'marriage') prep = checklist('marriagePrep', 'prepOpen', 'Ready for marriage', 'Something to be ready', '');
        if (m.area === 'church') prep = checklist('churchLook', 'churchOpen', 'What I\u2019m looking for', 'Something I\u2019m looking for', '');
        return '<div class="fcard first"><div class="ft">' + esc(m.title) + '</div><div class="fw">' + whenText(m.date) + ' \u00b7 ' + until(m.date) + ageAt(m.date) + '</div>' + note + prep + '</div>';
      }).join('') + '</div>';
    }
    if (next.length) {
      h += '<div class="focus small-cards">' + next.map(function (m) {
        return '<div class="fcard"><span class="label">Then</span><div class="ft">' + esc(m.title) + '</div><div class="fw">' + whenText(m.date) + ' \u00b7 ' + until(m.date) + ageAt(m.date) + '</div></div>';
      }).join('') + '</div>';
    }

    // Axis
    var zoom = state.zoom || 10;
    var t0 = new Date(THIS_YEAR, 0, 1), t1 = new Date(THIS_YEAR + zoom + 1, 0, 1);
    var fit = Math.min(window.innerWidth, 980) - 34;   // the line's box, inside the page gutter
    var W = zoom >= 50 ? fit : Math.max(fit, zoom * (zoom <= 10 ? 110 : 60));
    function X(d) { return 16 + (d - t0) / (t1 - t0) * (W - 32); }
    var inRange = ms.filter(function (m) { var d = ym(m.date); return d >= t0 && d < t1 && (state.showAll || m.big); });
    var later = ms.filter(function (m) { return ym(m.date) >= t1 && (state.showAll || m.big); }).length;

    // Lanes so labels never overlap: big ones stack upward, small ones downward.
    function lanes(list) {
      var ends = [], out = [];
      list.forEach(function (m) {
        var x = X(ym(m.date)), w = Math.min(m.key ? 300 : zoom >= 50 ? 210 : 250, (m.key ? 30 : 22) + m.title.length * (m.key ? 9 : 7.4));
        w = Math.min(w, W - 8);
        // Near the right edge the label hangs to the left of its pin instead.
        var lx = Math.min(x - 8, W - w - 4);
        var k = 0; while (ends[k] != null && ends[k] > lx - 4) k++;
        ends[k] = lx + w; out.push({ m: m, x: x, lx: lx, k: k, w: w });
      });
      return { items: out, n: ends.length };
    }
    var up = lanes(inRange.filter(function (m) { return m.big; }));
    var down = lanes(inRange.filter(function (m) { return !m.big; }));
    var LANE = 44, axis = 24 + Math.max(1, up.n) * LANE + 10, H = axis + 34 + (down.n ? down.n * 30 : 10);

    h += '<div class="zoom">' + ZOOMS.map(function (z) {
      return '<button data-zoom="' + z + '" class="' + (z === zoom ? 'on' : '') + '">' + z + ' years</button>';
    }).join('') + '<button data-act="show-all" class="' + (state.showAll ? 'on' : '') + '">' + (state.showAll ? 'All milestones' : 'Big ones only') + '</button>' + (later ? '<span class="muted small">' + later + ' more beyond ' + (THIS_YEAR + zoom) + '</span>' : '') + '</div>';

    if (PHONE()) h += vline(inRange);
    else {
    h += '<div class="lin-wrap"><div class="lin" style="width:' + W + 'px;height:' + H + 'px">';
    h += '<div class="axis" style="top:' + axis + 'px"></div>';
    var step = zoom <= 10 ? 1 : zoom <= 20 ? (W < 600 ? 5 : 2) : (W < 600 ? 10 : 5);
    for (var y = THIS_YEAR; y <= THIS_YEAR + zoom; y += step) {
      var x = X(new Date(y, 0, 1));
      h += '<div class="tick" style="left:' + x + 'px;top:' + (axis - 4) + 'px"></div>' +
        '<div class="yl" style="left:' + x + 'px;top:' + (axis + 8) + 'px">' + y + (state.born ? '<i>' + (y - state.born) + '</i>' : '') + '</div>';
    }
    var nx = X(today);
    h += '<div class="nowline" style="left:' + nx + 'px;height:' + H + 'px"></div><div class="nowlab" style="left:' + nx + 'px">Now</div>';
    var focusIds = focus.map(function (m) { return m.id; });
    up.items.forEach(function (it) {
      var top = axis - 16 - (it.k + 1) * LANE + 6;
      h += '<div class="stem" style="left:' + it.x + 'px;top:' + (top + 22) + 'px;height:' + (axis - top - 22) + 'px"></div>' +
        '<div class="ml big' + (it.m.key ? ' key' : '') + (it.m.done ? ' done' : '') + (focusIds.indexOf(it.m.id) > -1 ? ' focus' : '') + '" style="left:' + it.lx + 'px;top:' + top + 'px;max-width:' + it.w + 'px" title="' + esc(whenText(it.m.date)) + '">' +
        '<b style="border-color:' + colorOf(it.m.area) + '"></b>' + esc(it.m.title) + '</div>' +
        '<div class="pin big' + (it.m.key ? ' key' : '') + '" style="left:' + it.x + 'px;top:' + axis + 'px;background:' + colorOf(it.m.area) + '"></div>';
    });
    down.items.forEach(function (it) {
      var top = axis + 34 + it.k * 30;
      h += '<div class="stem thin" style="left:' + it.x + 'px;top:' + axis + 'px;height:' + (top - axis) + 'px"></div>' +
        '<div class="ml' + (it.m.done ? ' done' : '') + '" style="left:' + it.lx + 'px;top:' + top + 'px;max-width:' + it.w + 'px" title="' + esc(whenText(it.m.date)) + '">' + esc(it.m.title) + '</div>' +
        '<div class="pin" style="left:' + it.x + 'px;top:' + axis + 'px;background:' + colorOf(it.m.area) + '"></div>';
    });
    h += '</div></div>';
    }

    // Editable list
    h += '<button class="add" data-act="ms-edit">' + (state.editMs ? 'Done editing' : 'Edit milestones (' + ms.length + ')') + '</button>';
    if (state.editMs) {
      h += '<h2>Milestones <span class="label">★ big · ★★ one of the biggest</span></h2><div class="mlist">';
      ms.forEach(function (m) {
        h += '<div class="mrow' + (m.done ? ' done' : '') + '" data-ms-id="' + m.id + '">' +
          '<button class="star' + (m.big ? ' on' : '') + (m.key ? ' key' : '') + '" data-act="m-big" title="Tap: big, then one of the biggest">' + (m.key ? '\u2605\u2605' : '\u2605') + '</button>' +
          '<input type="text" data-m="title" value="' + esc(m.title) + '" placeholder="Milestone">' +
          '<input type="month" data-m="date" value="' + (/^\d{4}-\d{2}$/.test(m.date) ? m.date : '') + '">' +
          '<select data-m="area"><option value="">—</option>' + state.areas.map(function (a) {
            return '<option value="' + a.id + '"' + (a.id === m.area ? ' selected' : '') + '>' + esc(a.name || 'Untitled') + '</option>'; }).join('') + '</select>' +
          '<span class="mwhen">' + until(m.date) + ageAt(m.date) + '</span>' +
          '<button class="check' + (m.done ? ' on' : '') + '" data-act="m-done" title="Happened">' + (m.done ? '✓' : '') + '</button>' +
          '<button class="x" data-act="m-del" title="Remove">×</button></div>';
      });
      h += '</div><button class="add" data-act="m-add">+ Milestone</button>';
    }

    // What is going on right now
    h += '<h2>Happening now <span class="label">' + THIS_YEAR + ageTag(THIS_YEAR) + '</span></h2><div class="nowlist">';
    (state.now || []).forEach(function (n) {
      h += '<div class="it" data-now="' + n.id + '"><i class="dot" style="background:' + colorOf(n.area) + '"></i>' +
        '<div class="body"><span class="an"><span class="an-name">' + esc((state.areas.find(function (a) { return a.id === n.area; }) || {}).name || 'Area') + ' \u25be</span><select data-now-area="1" aria-label="Area"><option value="">—</option>' + state.areas.map(function (a) {
          return '<option value="' + a.id + '"' + (a.id === n.area ? ' selected' : '') + '>' + esc(a.name || 'Untitled') + '</option>'; }).join('') + '</select></span>' +
        '<div contenteditable="true" data-now-text="1" data-ph="Something happening now">' + esc(n.text) + '</div></div>' +
        '<button class="x" data-act="now-del" title="Remove">×</button></div>';
    });
    h += '</div><button class="add" data-act="now-add">+ Something happening now</button>';
    return h;
  }

  function thisYear() {
    var inYear = today >= Y0 && today < Y1;
    var curM = inYear ? today.getMonth() : -1;
    var h = '<p class="intro">' + (today < Y0 ? Math.ceil((Y0 - today) / 864e5) + ' days until ' + START + '. ' : '') +
      'Each goal has a start and a deadline. Tap a goal to change it.</p>';
    h += '<div class="months">' + MONTHS.map(function (m, i) { return '<span class="' + (i === curM ? 'cur' : '') + '">' + (PHONE() ? m[0] : m) + '</span>'; }).join('') + '</div>';

    state.areas.forEach(function (a) {
      var goals = state.goals.filter(function (g) { return g.area === a.id; })
        .sort(function (x, y) { return x.due < y.due ? -1 : 1; });
      h += '<div class="group"><div class="group-head"><span class="name">' + esc(a.name || 'Untitled') + '</span>' +
        (a.years[START] ? '<span class="yeargoal"><b>BY DEC 31</b>' + esc(a.years[START]) + '</span>' : '') + '</div>';
      goals.forEach(function (g) { h += goalRow(g, inYear); });
      h += '<button class="add" data-act="goal-add" data-area="' + a.id + '">+ Goal</button></div>';
    });
    return h;
  }

  function goalRow(g, inYear) {
    var d = daysTo(g.due), late = !g.done && d < 0;
    var dueTxt = g.done ? 'done' : (late ? Math.abs(d) + ' days late' : 'due ' + short(g.due) + (d <= 60 ? ' · ' + d + ' days' : ''));
    var left = frac(parse(g.start)) * 100, right = frac(new Date(parse(g.due).getTime() + 864e5)) * 100;
    var h = '<div class="row' + (g.done ? ' done' : '') + (late ? ' late' : '') + '" data-id="' + g.id + '">' +
      '<div class="row-top"><button class="check' + (g.done ? ' on' : '') + '" data-act="toggle" aria-label="Done">' + (g.done ? '✓' : '') + '</button>' +
      '<span class="row-title" data-act="open">' + esc(g.title || 'Untitled goal') + '</span>' +
      '<span class="due' + (late ? ' late' : (!g.done && d <= 30 ? ' soon' : '')) + '">' + dueTxt + '</span></div>' +
      '<div class="track"><div class="bar" style="left:' + left + '%;width:' + Math.max(0, right - left) + '%"></div>' +
      (inYear ? '<div class="today" style="left:' + (frac(today) * 100) + '%"></div>' : '') + '</div>';
    if (openId === g.id) {
      h += '<div class="editor"><div class="full"><label>Goal</label><input type="text" id="f-title" value="' + esc(g.title) + '" placeholder="What will be done"></div>' +
        '<div><label>Start</label><input type="date" id="f-start" value="' + g.start + '" min="' + START + '-01-01" max="' + START + '-12-31"></div>' +
        '<div><label>Deadline</label><input type="date" id="f-due" value="' + g.due + '" min="' + START + '-01-01" max="' + START + '-12-31"></div>' +
        '<div class="full"><label>Area</label><select id="f-area">' + state.areas.map(function (a) {
          return '<option value="' + a.id + '"' + (a.id === g.area ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="actions"><button class="btn del" data-act="del">Delete</button><span class="sp"></span>' +
        '<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save">Save</button></div></div>';
    }
    return h + '</div>';
  }

  /* ── events ── */
  function setPath(path, v) {
    var p = path.split('.'), o = state;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]] = o[p[i]] || {};
    o[p[p.length - 1]] = v;
  }
  function changed() { state.isDraft = false; save(); }

  document.addEventListener('change', function (e) {
    if (e.target.dataset.m) { msItem(e.target)[e.target.dataset.m] = e.target.value; changed(); render(); return; }
    if (e.target.dataset.nowArea) { nowItem(e.target).area = e.target.value; changed(); render(); return; }
  });
  document.addEventListener('input', function (e) {
    if (e.target.dataset.path) { setPath(e.target.dataset.path, e.target.textContent.trim()); changed(); }
    else if (e.target.dataset.clText) { clItem(e.target).text = e.target.textContent.trim(); changed(); }
    else if (e.target.dataset.prepText) { prepItem(e.target).text = e.target.textContent.trim(); changed(); }
    else if (e.target.dataset.nowText) { nowItem(e.target).text = e.target.textContent.trim(); changed(); }
  });
  function msItem(el) { var id = el.closest('[data-ms-id]').dataset.msId; return state.milestones.find(function (m) { return m.id === id; }); }
  function clList(el) { return state[el.closest('[data-cl]').dataset.cl]; }
  function clItem(el) { var id = el.closest('[data-cl-id]').dataset.clId; return clList(el).find(function (x) { return x.id === id; }); }
  function prepItem(el) { var id = el.closest('[data-prep]').dataset.prep; return state.marriagePrep.find(function (x) { return x.id === id; }); }
  function nowItem(el) { var id = el.closest('[data-now]').dataset.now; return state.now.find(function (n) { return n.id === id; }); }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.isContentEditable || e.target.dataset.m) { e.preventDefault(); e.target.blur(); }
    else if (e.target.closest('.editor')) { var s = document.querySelector('[data-act="save"]'); if (s) s.click(); }
  });
  document.addEventListener('paste', function (e) {
    if (!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text').replace(/\s+/g, ' '));
  });

  document.addEventListener('click', function (e) {
    var z = e.target.closest('[data-zoom]');
    if (z) { state.zoom = +z.dataset.zoom; save(); render(); return; }
    var v = e.target.closest('[data-view]');
    if (v) { state.view = planView = v.dataset.view; openId = null; save(); render(); return; }
    var part = e.target.closest('[data-part]');
    if (part) {
      var tl = part.dataset.part === 'timeline';
      state.view = tl ? 'timeline' : planView; openId = null;
      history.replaceState(null, '', tl ? '#timeline' : location.pathname + location.search);
      render(); window.scrollTo(0, 0); return;
    }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var row = el.closest('.row'), g = row && state.goals.find(function (x) { return x.id === row.dataset.id; });

    switch (el.dataset.act) {
      case 'toggle': g.done = !g.done; break;
      case 'open': openId = openId === g.id ? null : g.id; render(); focusTitle(); return;
      case 'close':
        if (!g.title) state.goals = state.goals.filter(function (x) { return x !== g; });
        openId = null; break;
      case 'save': {
        var t = document.getElementById('f-title').value.trim();
        var s = document.getElementById('f-start').value, d = document.getElementById('f-due').value;
        if (t) g.title = t;
        if (s) g.start = s;
        if (d) g.due = d;
        if (g.start > g.due) { var tmp = g.start; g.start = g.due; g.due = tmp; }
        g.area = document.getElementById('f-area').value;
        openId = null; break;
      }
      case 'del': state.goals = state.goals.filter(function (x) { return x !== g; }); openId = null; break;
      case 'goal-add': {
        var start = today >= Y0 && today < Y1 ? iso(today) : START + '-01-01';
        var due = iso(new Date(Math.min(parse(start).getTime() + 90 * 864e5, new Date(START, 11, 31).getTime())));
        var n = { id: uid(), area: el.dataset.area, title: '', start: start, due: due, done: false };
        state.goals.push(n); openId = n.id; changed(); render(); focusTitle(); return;
      }
      case 'cl-fold': state[el.dataset.openKey] = !state[el.dataset.openKey]; save(); render(); return;
      case 'cl-toggle': clItem(el).done = !clItem(el).done; break;
      case 'cl-del': { var ck = el.closest('[data-cl]').dataset.cl, cid = el.closest('[data-cl-id]').dataset.clId; state[ck] = state[ck].filter(function (x) { return x.id !== cid; }); break; }
      case 'cl-add': {
        var key = el.closest('[data-cl]').dataset.cl, cx = { id: uid(), text: '', done: false };
        (state[key] = state[key] || []).push(cx); changed(); render();
        var ct = document.querySelector('[data-cl-id="' + cx.id + '"] [data-cl-text]'); if (ct) ct.focus();
        return;
      }
      case 'prep-fold': state.prepOpen = !state.prepOpen; save(); render(); return;
      case 'prep-toggle': prepItem(el).done = !prepItem(el).done; break;
      case 'prep-del': { var pid = el.closest('[data-prep]').dataset.prep; state.marriagePrep = state.marriagePrep.filter(function (x) { return x.id !== pid; }); break; }
      case 'prep-add': {
        var px = { id: uid(), text: '', done: false };
        (state.marriagePrep = state.marriagePrep || []).push(px); changed(); render();
        var pt = document.querySelector('[data-prep="' + px.id + '"] [data-prep-text]'); if (pt) pt.focus();
        return;
      }
      case 'show-all': state.showAll = !state.showAll; break;
      case 'ms-edit': state.editMs = !state.editMs; break;
      case 'm-big': { var mm = msItem(el); if (mm.key) { mm.key = false; mm.big = false; } else if (mm.big) mm.key = true; else mm.big = true; break; }
      case 'm-done': msItem(el).done = !msItem(el).done; break;
      case 'm-del': { var mid = el.closest('[data-ms-id]').dataset.msId; state.milestones = state.milestones.filter(function (m) { return m.id !== mid; }); break; }
      case 'm-add': {
        var d = new Date(today.getFullYear(), today.getMonth() + 6, 1);
        var nm = { id: uid(), title: '', date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), area: '', big: false, done: false };
        (state.milestones = state.milestones || []).push(nm); changed(); render();
        var inp = document.querySelector('[data-ms-id="' + nm.id + '"] [data-m="title"]'); if (inp) inp.focus();
        return;
      }
      case 'now-del': { var nid = el.closest('[data-now]').dataset.now; state.now = state.now.filter(function (n) { return n.id !== nid; }); break; }
      case 'now-add': {
        var item = { id: uid(), area: '', text: '' };
        (state.now = state.now || []).push(item); changed(); render();
        var t = document.querySelector('[data-now="' + item.id + '"] [data-now-text]'); if (t) t.focus();
        return;
      }
      case 'area-add':
        state.areas.push({ id: uid(), name: '', years: {} }); changed(); render();
        var names = document.querySelectorAll('.five .name'); if (names.length) names[names.length - 1].focus();
        return;
      case 'area-del': {
        var a = state.areas[+el.dataset.i];
        var n2 = state.goals.filter(function (x) { return x.area === a.id; }).length;
        if (!confirm('Remove “' + (a.name || 'this area') + '”' + (n2 ? ' and its ' + n2 + ' goal' + (n2 === 1 ? '' : 's') : '') + '?')) return;
        state.areas.splice(+el.dataset.i, 1);
        state.goals = state.goals.filter(function (x) { return x.area !== a.id; });
        break;
      }
      case 'blank':
        if (!confirm('Clear the draft and start blank?')) return;
        state = { v: 11, isDraft: false, trajectory: '', churchLook: [], churchNote: '', marriageNote: '', marriagePrep: [], longDirection: '', now: [], milestones: [], born: state.born || null, view: state.view, direction: '', areas: [{ id: uid(), name: '', years: {} }], goals: [] };
        break;
      default: return;
    }
    changed(); render();
  });
  function focusTitle() { var f = document.getElementById('f-title'); if (f) f.focus(); }

  var resizeT;
  var lastW = window.innerWidth;
  // Only a width change (rotation, desktop resize) redraws; a phone keyboard changes the height.
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeT); resizeT = setTimeout(render, 150);
  });

  window.addEventListener('hashchange', function () {
    state.view = location.hash === '#timeline' ? 'timeline' : planView; render();
  });

  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
