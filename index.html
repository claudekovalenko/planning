<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Five-Year Plan</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1e222b;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --gold: #c9a25e;
    --gold-soft: rgba(201, 162, 94, 0.15);
    --line: #2a2e38;
    --green: #8fbf8f;
    --rust: #b06557;
    --sans: 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; line-height: 1.5; min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 16px 4rem; }
  .label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  [contenteditable] { outline: none; border-radius: 4px; cursor: text; }
  [contenteditable]:focus { background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft); }
  [contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); font-style: italic; opacity: 0.7; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 { font-weight: normal; font-size: 1.6rem; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .switch button { background: none; border: none; padding: 0.5rem 1rem; font-family: var(--sans); font-size: 0.85rem; color: var(--muted); }
  .switch button + button { border-left: 1px solid var(--line); }
  .switch button.on { background: var(--gold); color: #1a1408; font-weight: 600; }
  .intro { margin-top: 0.75rem; color: var(--muted); font-size: 0.92rem; max-width: 40rem; }
  .direction { border-left: 2px solid var(--gold); padding: 0.15rem 0 0.15rem 0.9rem; margin-top: 1rem; max-width: 46rem; }
  .direction .text { font-style: italic; font-size: 1.05rem; margin-top: 0.2rem; }
  .born { margin-top: 0.75rem; font-family: var(--sans); font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; }
  .born input { width: 5.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.5rem; font-size: 16px; }
  .age { font-family: var(--sans); font-size: 0.75em; color: var(--muted); font-weight: normal; white-space: nowrap; }
  .hd.goal .age, .cell.end .yr .age { color: var(--gold); opacity: 0.8; }
  .draft { margin-top: 1rem; font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }
  .draft button { background: none; border: none; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; font-size: 0.8rem; }

  /* ── 5 years ── */
  .five { margin-top: 1.5rem; display: grid; grid-template-columns: 11rem repeat(4, 1fr) 1.25fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .five > div { padding: 0.8rem 0.85rem; border-top: 1px solid var(--line); border-left: 1px solid var(--line); font-size: 0.92rem; min-width: 0; overflow-wrap: anywhere; }
  .five > .hd { border-top: none; background: var(--panel); font-family: var(--sans); font-size: 0.78rem; color: var(--muted); }
  .five > .hd.goal { color: var(--gold); }
  .five > .area { border-left: none; background: var(--panel); }
  .five > .area .name { font-size: 1rem; }
  .five > .cell.end { background: rgba(201, 162, 94, 0.07); }
  .five > .cell.now { background: rgba(255, 255, 255, 0.02); }
  .five.long { grid-template-columns: 11rem 1fr 1.2fr 1.2fr; }
  .five .yr { display: none; }
  .five .x { float: right; }

  /* ── 2027 timeline ── */
  .months { display: grid; grid-template-columns: repeat(12, 1fr); margin-top: 1.5rem; font-family: var(--sans); font-size: 0.7rem; color: var(--muted); position: sticky; top: 0; background: var(--bg); padding: 0.5rem 0; z-index: 2; border-bottom: 1px solid var(--line); }
  .months span { text-align: left; padding-left: 3px; }
  .months span.cur { color: var(--gold); }
  .group { margin-top: 1.5rem; }
  .group-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .group-head .name { font-size: 1.1rem; }
  .group-head .yeargoal { font-size: 0.88rem; color: var(--muted); flex: 1 1 16rem; }
  .group-head .yeargoal b { font-weight: normal; color: var(--gold); font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.12em; margin-right: 0.35rem; }

  .row { margin-top: 0.6rem; }
  .row-top { display: flex; align-items: center; gap: 0.6rem; }
  .check { flex: none; width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 50%; background: none; display: grid; place-items: center; font-size: 12px; color: var(--bg); }
  .check.on { background: var(--green); border-color: var(--green); }
  .row-title { flex: 1; min-width: 0; cursor: pointer; }
  .row.done .row-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .due { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .due.soon { color: var(--gold); }
  .due.late { color: var(--rust); }
  .track {
    position: relative; height: 12px; margin-top: 0.35rem; border-radius: 3px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 12));
    background-color: var(--panel);
  }
  .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: var(--gold); min-width: 6px; }
  .row.done .bar { background: var(--green); opacity: 0.6; }
  .row.late .bar { background: var(--rust); }
  .today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.7; }

  .editor { margin-top: 0.6rem; padding: 0.8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .editor .full { grid-column: 1 / -1; }
  .editor label { display: block; font-family: var(--sans); font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .editor input, .editor select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem 0.6rem; font-size: 16px; }
  .editor input[type=date] { color-scheme: dark; }
  .editor .actions { grid-column: 1 / -1; display: flex; gap: 0.5rem; }
  .editor .actions .sp { flex: 1; }
  .btn { background: var(--gold); color: #1a1408; border: none; border-radius: 8px; padding: 0.45rem 1rem; font-family: var(--sans); font-size: 0.85rem; font-weight: 600; }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: normal; }
  .btn.del { background: none; color: var(--rust); border: 1px solid var(--rust); font-weight: normal; }
  .add { margin-top: 0.6rem; background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 0.35rem 0.8rem; font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }
  .add:hover { color: var(--gold); border-color: var(--gold); }
  .x { background: none; border: none; color: var(--muted); opacity: 0.5; font-size: 1rem; line-height: 1; }
  .x:hover { opacity: 1; color: var(--rust); }

  .foot { margin-top: 3rem; text-align: center; font-style: italic; color: var(--muted); font-size: 0.9rem; }
  .foot span { display: block; font-style: normal; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.14em; margin-top: 0.25rem; }

  /* Phones: the five-year table becomes one card per area, years stacked. */
  @media (max-width: 760px) {
    .five { display: block; border: none; }
    .five > .hd { display: none; }
    .five > div { border: none; padding: 0.35rem 0; }
    .five > .area { background: none; margin-top: 1.5rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--line); }
    .five > .cell { display: grid; grid-template-columns: 3.2rem 1fr; gap: 0.5rem; }
    .five > .cell.end { background: none; }
    .five > .cell.now { background: none; }
    .five .cell { grid-template-columns: 3.6rem 1fr; }
    .five .yr .age { display: block; font-size: 0.7rem; }
    .five .yr { display: block; font-family: var(--sans); font-size: 0.75rem; color: var(--muted); padding-top: 0.15rem; }
    .five .cell.end .yr { color: var(--gold); }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  var KEY = 'planning.five.v1';
  var START = 2027, YEARS = [2027, 2028, 2029, 2030, 2031], MID = 2036, FAR = 2046;
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var OLD_DIRECTIONS = ['Growing in preaching, and from there into disciple-making: messages that hand people a next step, and a pathway that carries them from reached to sent.'];
  var DIRECTION = 'Rooted in a church I grow deeply with; from there, growing in preaching, and from preaching into disciple-making.';
  var CHURCH = { id: 'church', name: 'Church home', years: {
    2027: 'Found the right church, committed to it, and started serving',
    2028: 'Known there: in a group, with people who know me well',
    2029: 'Grown deeply with this church; trusted with more',
    2030: 'Helping build its culture of discipleship',
    2031: 'Deeply rooted in a church family I\u2019ve grown with for years' } };
  function churchGoals() {
    return [
      { title: 'Visit and pray through the churches I\u2019m considering', start: '2027-01-01', due: '2027-02-28' },
      { title: 'Decide on my church, and walk it through Centered', start: '2027-03-01', due: '2027-03-31' },
      { title: 'Join a group and a place to serve', start: '2027-04-01', due: '2027-05-31' },
      { title: 'Meet with a pastor there; share where I sense God leading', start: '2027-04-01', due: '2027-06-30' }
    ].map(function (g) { return { id: uid(), area: 'church', title: g.title, start: g.start, due: g.due, done: false }; });
  }
  var PREACHING = { id: 'preaching', name: 'Preaching', years: {
    2027: 'Preaching regularly: 12 messages, honest feedback on each, every one ending in a next step',
    2028: 'A trusted voice in my church; a teaching series that moves people into discipleship',
    2029: 'Preaching that feeds the pathway: people step from the message into a group',
    2030: 'Training others to open and teach the Word',
    2031: 'Opening the Word with clarity and power, every message leading people into real discipleship' } };
  var DISCIPLES = { 2027: 'Pathway written on one page; 2 men walking through stage one',
    2028: 'A discipleship cycle running on campus; the first leaders emerging',
    2029: 'Disciples making disciples: leaders I raised up discipling others',
    2030: 'Several groups led by people I raised up',
    2031: 'Disciples on campus who make disciples, with leaders sent out to the ends of the earth' };
  function preachingGoals() {
    return [
      { title: 'Write and preach a 10-minute message; get a mentor’s critique', start: '2027-01-04', due: '2027-02-15' },
      { title: 'Preach or teach 6 times, with honest feedback on each', start: '2027-02-16', due: '2027-06-30' },
      { title: 'Preach or teach 6 more, each ending in a step into discipleship', start: '2027-07-01', due: '2027-12-15' }
    ].map(function (g) { return { id: uid(), area: 'preaching', title: g.title, start: g.start, due: g.due, done: false }; });
  }

  var LONG_DIRECTION = 'A father in the faith: rooted in one church family, preaching that makes disciples, and generations of leaders sent out to the ends of the earth \u2014 with a full house of children who follow Jesus.';
  var LONG = {
    church:    { 2036: 'A pillar in my church family, helping lead it', 2046: 'A father in the faith to a church family I\u2019ve grown with for decades' },
    preaching: { 2036: 'Preaching that moves people into discipleship, in my church and beyond', 2046: 'Training the next generation of preachers' },
    ministry:  { 2036: 'A multiplying movement on campuses: disciples, leaders, and leaders of leaders', 2046: 'Generations of disciples, with leaders sent out to the ends of the earth' },
    god:       { 2036: 'A life of prayer and the Word that others can lean on', 2046: 'Still remaining in Jesus, more like him every year' },
    marriage:  { 2036: 'A growing marriage and a full house, on the way to 4\u20137 kids', 2046: '4 to 7 children who follow Jesus, in a culture so strong they could almost grow up unsupervised' },
    health:    { 2036: 'Still strong and training; energy for a full house and a full calling', 2046: 'Healthy and strong enough to keep serving for decades more' },
    provision: { 2036: 'Income I don\u2019t trade time for covering much of what the family spends', 2046: 'Free: time fully given to the calling, and generous beyond the tithe' }
  };
  function addLong(st) {
    st.areas.forEach(function (a) {
      var l = LONG[a.id]; if (!l) return;
      [2036, 2046].forEach(function (y) { if (!a.years[y]) a.years[y] = l[y]; });
      if (a.id === 'marriage' && (!a.years[2031] || a.years[2031] === 'Married, leading a home with a strong, good culture')) a.years[2031] = 'Married, with our first children; leading a home with a strong, good culture';
    });
    if (!st.longDirection) st.longDirection = LONG_DIRECTION;
  }

  /* Starting draft, drawn from the Vision app. The order is the direction:
     preaching first, and disciple-making growing out of it. */
  function draft() {
    function g(area, title, start, due) { return { id: uid(), area: area, title: title, start: start, due: due, done: false }; }
    return {
      v: 4, isDraft: true, view: 'five', direction: DIRECTION,
      areas: [
        JSON.parse(JSON.stringify(CHURCH)),
        JSON.parse(JSON.stringify(PREACHING)),
        { id: 'ministry', name: 'Disciple-making', years: JSON.parse(JSON.stringify(DISCIPLES)) },
        { id: 'god', name: 'Walk with God', years: {
          2027: 'Read through the whole Bible; a daily rhythm of prayer',
          2031: 'Deeply saturated in the Word, praying daily, obeying what I read' } },
        { id: 'marriage', name: 'Marriage & family', years: {
          2027: 'Clear marriage-prep steps, a married mentor, solid friendships',
          2031: 'Married, with our first children; leading a home with a strong, good culture' } },
        { id: 'health', name: 'Health', years: {
          2027: 'Training 3x a week, measurably stronger',
          2031: 'A strong body that carries the calling for the long haul' } },
        { id: 'provision', name: 'Provision', years: {
          2027: 'One income experiment tested; support raising decided',
          2031: 'Provision that frees my time for disciple-making' } }
      ],
      goals: churchGoals().concat(preachingGoals(), [
        g('ministry', 'Write my disciple-making pathway', '2027-01-04', '2027-03-31'),
        g('ministry', 'Walk 2 men through stage one', '2027-04-01', '2027-06-30'),
        g('ministry', 'Launch a discipleship cycle on campus', '2027-08-01', '2027-09-15'),
        g('god', 'Read through the Bible', '2027-01-01', '2027-12-31'),
        g('marriage', 'Ask a married mentor to walk with me', '2027-01-01', '2027-03-31'),
        g('marriage', 'Meet regularly with 2–3 men', '2027-02-01', '2027-12-31'),
        g('health', 'Train 3x a week and retest lifts', '2027-01-04', '2027-06-30'),
        g('provision', 'Test one AI income idea', '2027-02-01', '2027-05-31'),
        g('provision', 'Decide how support raising fits', '2027-03-01', '2027-04-30')
      ])
    };
  }

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!state || !Array.isArray(state.areas) || (state.isDraft && state.v !== 4)) state = draft();
  if (state.isDraft && !state.longDirection) addLong(state);
  // A plan already edited under v1: add preaching ahead of disciple-making, keep everything written.
  if (state.v === 1) {
    var mi = state.areas.findIndex(function (a) { return a.id === 'ministry'; });
    if (!state.areas.some(function (a) { return a.id === 'preaching'; })) {
      state.areas.splice(Math.max(0, mi), 0, JSON.parse(JSON.stringify(PREACHING)));
      state.goals = preachingGoals().concat(state.goals || []);
      (state.goals || []).forEach(function (g) {
        if (g.area === 'ministry' && /planted/i.test(g.title)) g.area = 'preaching';
      });
    }
    var m = state.areas.find(function (a) { return a.id === 'ministry'; });
    if (m) {
      if (m.name === 'Ministry') m.name = 'Disciple-making';
      Object.keys(DISCIPLES).forEach(function (y) { if (!m.years[y]) m.years[y] = DISCIPLES[y]; });
    }
    state.v = 2;
  }
  // v2 -> v3: the church comes first; everything written is kept.
  if (state.v === 2) {
    if (!state.areas.some(function (a) { return a.id === 'church'; })) {
      state.areas.unshift(JSON.parse(JSON.stringify(CHURCH)));
      var moved = false;
      (state.goals || []).forEach(function (g) {
        if (/planted|church/i.test(g.title) && g.area !== 'church') { g.area = 'church'; moved = true; }
      });
      state.goals = churchGoals().filter(function (g, i) { return !(moved && i === 1); }).concat(state.goals || []);
    }
    if (!state.direction || OLD_DIRECTIONS.indexOf(state.direction) > -1) state.direction = DIRECTION;
    state.v = 3;
  }
  // v3 -> v4: add the 10- and 20-year horizon; only empty cells are filled.
  if (state.v === 3) {
    addLong(state);
    state.v = 4;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  state.goals = state.goals || [];
  state.view = 'five';   // always open on the five-year plan
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var openId = null;   // goal whose editor is open

  /* ── dates ── */
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var Y0 = new Date(START, 0, 1), Y1 = new Date(START + 1, 0, 1), SPAN = Y1 - Y0;
  function frac(d) { return Math.max(0, Math.min(1, (d - Y0) / SPAN)); }
  var today = new Date(); today.setHours(0, 0, 0, 0);
  function daysTo(s) { return Math.round((parse(s) - today) / 864e5); }
  function short(s) { return parse(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

  // Age reached by the end of a year (birthday falls somewhere in it).
  function age(y) { return state.born ? y - state.born : null; }
  function ageTag(y, pre) { var a = age(y); return a == null ? '' : ' <span class="age">' + (pre || '\u00b7 age ') + a + '</span>'; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ed(path, value, ph, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + ' contenteditable="true" data-path="' + path + '" data-ph="' + esc(ph) + '">' + esc(value) + '</div>'; }

  /* ── views ── */
  function render() {
    var titles = {
      long: 'The long view \u00b7 ' + YEARS[4] + '\u2013' + FAR + (state.born ? ' <span class="age">\u00b7 ages ' + age(YEARS[4]) + '\u2013' + age(FAR) + '</span>' : ''),
      five: 'Five years \u00b7 ' + START + '\u2013' + YEARS[4] + (state.born ? ' <span class="age">\u00b7 ages ' + age(START) + '\u2013' + age(YEARS[4]) + '</span>' : ''),
      year: START + ageTag(START, '\u00b7 turning ')
    };
    var h = '<header><h1>' + titles[state.view] + '</h1><div class="switch">' +
      [['five', '5 years'], ['long', '20 years'], ['year', String(START)]].map(function (v) {
        return '<button data-view="' + v[0] + '" class="' + (state.view === v[0] ? 'on' : '') + '">' + v[1] + '</button>';
      }).join('') + '</div></header>';
    h += state.view === 'long'
      ? '<div class="direction"><span class="label">Where it is all heading</span>' + ed('longDirection', state.longDirection, 'In 10 to 20 years, I sense God leading me toward\u2026', 'text') + '</div>'
      : '<div class="direction"><span class="label">The direction</span>' + ed('direction', state.direction, 'Where I sense God leading over these five years', 'text') + '</div>';
    h += '<label class="born">Born in <input type="number" inputmode="numeric" id="born" min="1930" max="2026" placeholder="year" value="' + (state.born || '') + '">' +
      (state.born ? '<span>' + age(new Date().getFullYear()) + ' this year</span>' : '<span>to see your age beside each year</span>') + '</label>';
    h += state.view === 'long' ? longView() : state.view === 'five' ? fiveYears() : thisYear();
    if (state.isDraft) h += '<p class="draft">A starting draft from your Vision. Tap any text to rewrite it. <button data-act="blank">Start blank</button></p>';
    h += '<div class="foot">“The heart of man plans his way, but the LORD establishes his steps.”<span>PROVERBS 16:9</span></div>';
    document.getElementById('app').innerHTML = h;
  }

  function fiveYears() {
    var h = '<p class="intro">Where you want to be by ' + YEARS[4] + ' in each area, and the milestone for the end of each year on the way there.</p>';
    h += '<div class="five"><div class="hd">Area</div>' + YEARS.map(function (y) {
      return '<div class="hd' + (y === YEARS[4] ? ' goal' : '') + '">' + (y === YEARS[4] ? 'By ' + y + ' — the goal' : 'End of ' + y) + ageTag(y) + '</div>';
    }).join('');
    state.areas.forEach(function (a, i) {
      h += '<div class="area"><button class="x" data-act="area-del" data-i="' + i + '" title="Remove area">×</button>' + ed('areas.' + i + '.name', a.name, 'Area', 'name') + '</div>';
      YEARS.forEach(function (y) {
        var cls = 'cell' + (y === YEARS[4] ? ' end' : '') + (y === START ? ' now' : '');
        h += '<div class="' + cls + '"><span class="yr">' + (y === YEARS[4] ? 'By ' + y : y) + ageTag(y, 'age ') + '</span>' +
          ed('areas.' + i + '.years.' + y, a.years[y], y === YEARS[4] ? 'Where I want to be' : 'Milestone') + '</div>';
      });
    });
    h += '</div><button class="add" data-act="area-add">+ Add an area</button>';
    return h;
  }

  function longView() {
    var cols = [YEARS[4], MID, FAR];
    var h = '<p class="intro">Where each area is heading in 10 and 20 years. The five-year goal is the first step toward it.</p>';
    h += '<div class="five long"><div class="hd">Area</div>' + cols.map(function (y) {
      return '<div class="hd' + (y === FAR ? ' goal' : '') + '">By ' + y + (y === YEARS[4] ? ' \u2014 5 years' : y === MID ? ' \u2014 10 years' : ' \u2014 20 years') + ageTag(y) + '</div>';
    }).join('');
    state.areas.forEach(function (a, i) {
      h += '<div class="area"><button class="x" data-act="area-del" data-i="' + i + '" title="Remove area">\u00d7</button>' + ed('areas.' + i + '.name', a.name, 'Area', 'name') + '</div>';
      cols.forEach(function (y) {
        h += '<div class="cell' + (y === FAR ? ' end' : '') + '"><span class="yr">By ' + y + ageTag(y, 'age ') + '</span>' +
          ed('areas.' + i + '.years.' + y, a.years[y], y === YEARS[4] ? 'Five-year goal' : y === MID ? 'In 10 years' : 'In 20 years') + '</div>';
      });
    });
    h += '</div><button class="add" data-act="area-add">+ Add an area</button>';
    return h;
  }

  function thisYear() {
    var inYear = today >= Y0 && today < Y1;
    var curM = inYear ? today.getMonth() : -1;
    var h = '<p class="intro">' + (today < Y0 ? Math.ceil((Y0 - today) / 864e5) + ' days until ' + START + '. ' : '') +
      'Each goal has a start and a deadline. Tap a goal to change it.</p>';
    h += '<div class="months">' + MONTHS.map(function (m, i) { return '<span class="' + (i === curM ? 'cur' : '') + '">' + m + '</span>'; }).join('') + '</div>';

    state.areas.forEach(function (a) {
      var goals = state.goals.filter(function (g) { return g.area === a.id; })
        .sort(function (x, y) { return x.due < y.due ? -1 : 1; });
      h += '<div class="group"><div class="group-head"><span class="name">' + esc(a.name || 'Untitled') + '</span>' +
        (a.years[START] ? '<span class="yeargoal"><b>BY DEC 31</b>' + esc(a.years[START]) + '</span>' : '') + '</div>';
      goals.forEach(function (g) { h += goalRow(g, inYear); });
      h += '<button class="add" data-act="goal-add" data-area="' + a.id + '">+ Goal</button></div>';
    });
    return h;
  }

  function goalRow(g, inYear) {
    var d = daysTo(g.due), late = !g.done && d < 0;
    var dueTxt = g.done ? 'done' : (late ? Math.abs(d) + ' days late' : 'due ' + short(g.due) + (d <= 60 ? ' · ' + d + ' days' : ''));
    var left = frac(parse(g.start)) * 100, right = frac(new Date(parse(g.due).getTime() + 864e5)) * 100;
    var h = '<div class="row' + (g.done ? ' done' : '') + (late ? ' late' : '') + '" data-id="' + g.id + '">' +
      '<div class="row-top"><button class="check' + (g.done ? ' on' : '') + '" data-act="toggle" aria-label="Done">' + (g.done ? '✓' : '') + '</button>' +
      '<span class="row-title" data-act="open">' + esc(g.title || 'Untitled goal') + '</span>' +
      '<span class="due' + (late ? ' late' : (!g.done && d <= 30 ? ' soon' : '')) + '">' + dueTxt + '</span></div>' +
      '<div class="track"><div class="bar" style="left:' + left + '%;width:' + Math.max(0, right - left) + '%"></div>' +
      (inYear ? '<div class="today" style="left:' + (frac(today) * 100) + '%"></div>' : '') + '</div>';
    if (openId === g.id) {
      h += '<div class="editor"><div class="full"><label>Goal</label><input type="text" id="f-title" value="' + esc(g.title) + '" placeholder="What will be done"></div>' +
        '<div><label>Start</label><input type="date" id="f-start" value="' + g.start + '" min="' + START + '-01-01" max="' + START + '-12-31"></div>' +
        '<div><label>Deadline</label><input type="date" id="f-due" value="' + g.due + '" min="' + START + '-01-01" max="' + START + '-12-31"></div>' +
        '<div class="full"><label>Area</label><select id="f-area">' + state.areas.map(function (a) {
          return '<option value="' + a.id + '"' + (a.id === g.area ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="actions"><button class="btn del" data-act="del">Delete</button><span class="sp"></span>' +
        '<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save">Save</button></div></div>';
    }
    return h + '</div>';
  }

  /* ── events ── */
  function setPath(path, v) {
    var p = path.split('.'), o = state;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]] = o[p[i]] || {};
    o[p[p.length - 1]] = v;
  }
  function changed() { state.isDraft = false; save(); }

  document.addEventListener('change', function (e) {
    if (e.target.id !== 'born') return;
    var v = parseInt(e.target.value, 10);
    state.born = v >= 1930 && v <= 2026 ? v : null;
    changed(); render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.dataset.path) { setPath(e.target.dataset.path, e.target.textContent.trim()); changed(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
    else if (e.target.closest('.editor')) { var s = document.querySelector('[data-act="save"]'); if (s) s.click(); }
  });
  document.addEventListener('paste', function (e) {
    if (!e.target.isContentEditable) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text').replace(/\s+/g, ' '));
  });

  document.addEventListener('click', function (e) {
    var v = e.target.closest('[data-view]');
    if (v) { state.view = v.dataset.view; openId = null; save(); render(); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var row = el.closest('.row'), g = row && state.goals.find(function (x) { return x.id === row.dataset.id; });

    switch (el.dataset.act) {
      case 'toggle': g.done = !g.done; break;
      case 'open': openId = openId === g.id ? null : g.id; render(); focusTitle(); return;
      case 'close':
        if (!g.title) state.goals = state.goals.filter(function (x) { return x !== g; });
        openId = null; break;
      case 'save': {
        var t = document.getElementById('f-title').value.trim();
        var s = document.getElementById('f-start').value, d = document.getElementById('f-due').value;
        if (t) g.title = t;
        if (s) g.start = s;
        if (d) g.due = d;
        if (g.start > g.due) { var tmp = g.start; g.start = g.due; g.due = tmp; }
        g.area = document.getElementById('f-area').value;
        openId = null; break;
      }
      case 'del': state.goals = state.goals.filter(function (x) { return x !== g; }); openId = null; break;
      case 'goal-add': {
        var start = today >= Y0 && today < Y1 ? iso(today) : START + '-01-01';
        var due = iso(new Date(Math.min(parse(start).getTime() + 90 * 864e5, new Date(START, 11, 31).getTime())));
        var n = { id: uid(), area: el.dataset.area, title: '', start: start, due: due, done: false };
        state.goals.push(n); openId = n.id; changed(); render(); focusTitle(); return;
      }
      case 'area-add':
        state.areas.push({ id: uid(), name: '', years: {} }); changed(); render();
        var names = document.querySelectorAll('.five .name'); if (names.length) names[names.length - 1].focus();
        return;
      case 'area-del': {
        var a = state.areas[+el.dataset.i];
        var n2 = state.goals.filter(function (x) { return x.area === a.id; }).length;
        if (!confirm('Remove “' + (a.name || 'this area') + '”' + (n2 ? ' and its ' + n2 + ' goal' + (n2 === 1 ? '' : 's') : '') + '?')) return;
        state.areas.splice(+el.dataset.i, 1);
        state.goals = state.goals.filter(function (x) { return x.area !== a.id; });
        break;
      }
      case 'blank':
        if (!confirm('Clear the draft and start blank?')) return;
        state = { v: 4, isDraft: false, longDirection: '', born: state.born || null, view: state.view, direction: '', areas: [{ id: uid(), name: '', years: {} }], goals: [] };
        break;
      default: return;
    }
    changed(); render();
  });
  function focusTitle() { var f = document.getElementById('f-title'); if (f) f.focus(); }

  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
